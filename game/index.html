<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#f3c9a4" />
    <title>Ocean Drive</title>
    <meta name="description" content="Walk, ride and drive Ocean Drive, Miami Beach, at sunrise, in the browser. Every hotel, palm, car, wave and sound generated in code, plus a 3D Collect Drop garage." />
    <meta property="og:title" content="Ocean Drive · Miami Beach at sunrise" />
    <meta property="og:description" content="Walk, ride and drive Ocean Drive at sunrise, in the browser. Everything generated in code. Pull a car from the Collect Drop garage and crash it." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://drcollect.github.io/ocean-drive/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="data:," />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #f1d2b6;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        touch-action: none;
      }
      canvas#c {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      #title {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: #4a3a46;
        font-family: 'Avenir Next', Avenir, 'Futura', 'Helvetica Neue', system-ui, sans-serif;
        background:
          radial-gradient(120% 70% at 50% 100%, #ffd9a0 0%, #f7b99a 28%, #e9a9b4 48%, rgba(233, 169, 180, 0) 70%),
          linear-gradient(#a9c6de 0%, #cfd7e2 40%, #f0cdbf 70%, #f6c79b 100%);
        transition: opacity 1.4s ease;
        z-index: 10;
        cursor: default;
      }
      #title.gone {
        opacity: 0;
        pointer-events: none;
      }
      #title .sun {
        position: absolute;
        left: 50%;
        bottom: 21%;
        width: 70px;
        height: 70px;
        margin-left: -35px;
        border-radius: 50%;
        background: radial-gradient(circle, #fffbe8 0%, #ffe7ae 45%, rgba(255, 214, 150, 0) 72%);
        filter: blur(0.4px);
      }
      #title .sea {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 21%;
        background: linear-gradient(#e8b98f 0%, #b9a3a0 18%, #7f9aa6 60%, #6d8a98 100%);
      }
      #title .glint {
        position: absolute;
        left: 50%;
        bottom: 0;
        width: 34px;
        height: 21%;
        margin-left: -17px;
        background: linear-gradient(rgba(255, 238, 200, 0.95), rgba(255, 230, 190, 0.15));
        filter: blur(3px);
      }
      #title h1 {
        position: relative;
        margin: 0 0 0.3em;
        padding: 0 16px;
        text-align: center;
        line-height: 1.15;
        font-weight: 300;
        font-size: clamp(30px, 8vw, 96px);
        letter-spacing: 0.32em;
        margin-right: -0.32em;
        text-transform: uppercase;
        color: #fff8f0;
        text-shadow: 0 2px 30px rgba(170, 90, 90, 0.35);
      }
      #title .sub {
        position: relative;
        font-size: clamp(13px, 1.8vw, 18px);
        letter-spacing: 0.42em;
        margin-right: -0.42em;
        text-transform: uppercase;
        color: #6e5160;
      }
      #title .bar {
        position: relative;
        width: min(340px, 70vw);
        height: 2px;
        margin-top: 3.2em;
        background: rgba(255, 255, 255, 0.35);
        overflow: hidden;
      }
      #title .bar i {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 0%;
        background: #fffaf2;
        transition: width 0.25s ease;
      }
      #title .stage {
        position: relative;
        margin-top: 0.9em;
        min-height: 1.3em;
        font-size: 12px;
        letter-spacing: 0.3em;
        margin-right: -0.3em;
        text-transform: uppercase;
        color: rgba(90, 64, 80, 0.8);
      }
      #title .go {
        position: relative;
        margin-top: 1.6em;
        font-size: 13px;
        letter-spacing: 0.3em;
        margin-right: -0.3em;
        text-transform: uppercase;
        color: #fffaf2;
        opacity: 0;
        transition: opacity 0.8s ease;
      }
      #title.ready .go {
        opacity: 1;
      }
      #title.ready {
        cursor: pointer;
      }
      @media (max-width: 600px) {
        #title h1 {
          letter-spacing: 0.2em;
          margin-right: -0.2em;
        }
        #title .sub {
          letter-spacing: 0.28em;
          margin-right: -0.28em;
        }
      }
      #title .keys {
        position: absolute;
        bottom: 3.2%;
        left: 16px;
        right: 16px;
        text-align: center;
        font-size: 11px;
        letter-spacing: 0.18em;
        color: rgba(255, 250, 242, 0.85);
      }
      #title .err {
        position: relative;
        margin-top: 1.4em;
        max-width: 80vw;
        font-size: 13px;
        color: #7a2b2b;
        text-align: center;
      }
      #pause {
        position: fixed;
        left: 50%;
        bottom: 26px;
        transform: translateX(-50%);
        font-family: 'Avenir Next', Avenir, 'Helvetica Neue', system-ui, sans-serif;
        font-size: 12px;
        letter-spacing: 0.25em;
        text-transform: uppercase;
        color: rgba(255, 252, 246, 0.9);
        text-shadow: 0 1px 8px rgba(0, 0, 0, 0.35);
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.5s ease;
        z-index: 5;
        white-space: nowrap;
      }
      #pause.on {
        opacity: 1;
      }
      #hud {
        position: fixed;
        left: 8px;
        top: 8px;
        font: 11px/1.35 ui-monospace, Menlo, monospace;
        color: #fff;
        background: rgba(0, 0, 0, 0.35);
        padding: 4px 6px;
        white-space: pre;
        pointer-events: none;
        z-index: 6;
        display: none;
      }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="title">
      <div class="sea"></div>
      <div class="glint"></div>
      <div class="sun"></div>
      <h1>Ocean Drive</h1>
      <div class="sub">Miami Beach · morning</div>
      <div class="bar"><i></i></div>
      <div class="stage"></div>
      <div class="go">Click to start</div>
      <div class="keys">WASD walk · Shift faster · Space jump · E ride / use · I car card · M mute · Esc release</div>
    </div>
    <div id="pause"></div>
    <div id="hud"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
